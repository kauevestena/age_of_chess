name: Browser game and GitHub Pages
on:
  pull_request:
    paths:
      [
        "web/**",
        "rulesets/**",
        "implementation/age_of_chess/**",
        ".github/workflows/pages.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "web/**",
        "rulesets/**",
        "implementation/age_of_chess/**",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          npm ci --prefix web --ignore-scripts
          cd web
          npx playwright install --with-deps chromium
      - name: Create Python oracle environment
        run: |
          python -m venv .venv
          .venv/bin/pip install numpy pydantic PyYAML gymnasium pettingzoo
      - name: Check canonical rules and browser engine
        run: |
          .venv/bin/python web/scripts/export_rules.py --check
          npm test --prefix web
          node web/tests/parity.mjs
      - name: Exercise desktop, touch, audio, AI, saves and cinematics
        run: npm run test:browser --prefix web
      - name: Preserve browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: web/test-results/
          if-no-files-found: ignore
      - name: Build the static game
        run: npm run build --prefix web
      - name: Package the Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the game
        id: deployment
        uses: actions/deploy-pages@v4
